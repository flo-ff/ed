backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

# local_backend allows editing without GitHub OAuth when running `npx decap-server`
local_backend: true

site_url: /
display_url: /
logo_url: /favicon.svg

# publish_mode is 'simple' locally (decap-server fs). Use 'editorial_workflow' only with git backend in production.
# Set MODE=git for local editorial workflow: `MODE=git npx decap-server`
publish_mode: simple
editor:
  preview: true

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/content/settings/site.md"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Site Description", name: "siteDescription", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string", required: false, hint: "Big headline on homepage" }
          - { label: "Hero Text", name: "heroText", widget: "text", required: false }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Contact Email", name: "email", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
          - { label: "Background Image (behind intro)", name: "image", widget: "image", required: false, hint: "Faint B&W city texture behind 'The City Is Not A Background' — keep subtle" }
          - { label: "Body", name: "body", widget: "markdown" }
      - label: "Impressum"
        name: "impressum"
        file: "src/content/pages/impressum.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "infocard"
    label: "Info Card (homepage)"
    files:
      - label: "Film / Info Card"
        name: "card"
        file: "src/content/infocard/card.md"
        fields:
          - { label: "Label (small top)", name: "label", widget: "string", required: false, hint: "e.g. How I shoot — film + digital" }
          - { label: "Title", name: "title", widget: "string", hint: "First line, e.g. I love" }
          - { label: "Title Highlight (red)", name: "titleHighlight", widget: "string", required: false, hint: "Second word in red, e.g. film" }
          - { label: "Main Text", name: "body", widget: "markdown", hint: "Supports bold, paragraphs" }
          - { label: "Box 1 Title", name: "box1Title", widget: "string", required: false }
          - { label: "Box 1 Text", name: "box1Text", widget: "text", required: false }
          - { label: "Box 2 Title", name: "box2Title", widget: "string", required: false }
          - { label: "Box 2 Text", name: "box2Text", widget: "text", required: false }
          - { label: "Footer (handwritten)", name: "footer", widget: "string", required: false }

  - name: "hero"
    label: "Hero (random)"
    folder: "src/content/hero"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Image (B&W, high contrast)", name: "image", widget: "image", hint: "One of these is picked randomly on each visit" }
      - { label: "Alt Text", name: "alt", widget: "string", required: false }
      - { label: "Note (not shown)", name: "body", widget: "markdown", required: false }

  - name: "galleries"
    label: "Galleries"
    folder: "src/content/galleries"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. Downtown Night Session" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false, hint: "Thumbnail on homepage" }
      - { label: "Draft (hidden)", name: "draft", widget: "boolean", required: false, default: false }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Alt Text", name: "alt", widget: "string", required: false, hint: "For SEO/accessibility" }
      - { label: "Body (optional text below gallery)", name: "body", widget: "markdown", required: false }
