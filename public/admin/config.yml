backend:
  name: github
  repo: flo-ff/ed
  branch: main

# For Netlify Identity (git-gateway) — uncomment to use invited emails instead of GitHub logins:
# backend:
#   name: git-gateway
#   branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

# local_backend allows editing without GitHub OAuth when running `npx decap-server`
local_backend: true

site_url: https://flo-ff.github.io/ed
display_url: https://flo-ff.github.io/ed
logo_url: https://flo-ff.github.io/ed/favicon.svg

publish_mode: editorial_workflow
editor:
  preview: true

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General"
        name: "site"
        file: "src/content/settings/site.md"
        fields:
          - { label: "Site Title", name: "siteTitle", widget: "string" }
          - { label: "Site Description", name: "siteDescription", widget: "string" }
          - { label: "Hero Title", name: "heroTitle", widget: "string", required: false, hint: "Big headline on homepage" }
          - { label: "Hero Text", name: "heroText", widget: "text", required: false }
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Contact Email", name: "email", widget: "string", required: false }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "string", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "galleries"
    label: "Galleries"
    folder: "src/content/galleries"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "e.g. Downtown Night Session" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false, hint: "Thumbnail on homepage" }
      - { label: "Draft (hidden)", name: "draft", widget: "boolean", required: false, default: false }
      - label: "Images"
        name: "images"
        widget: "list"
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "image", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string", required: false }
          - { label: "Alt Text", name: "alt", widget: "string", required: false, hint: "For SEO/accessibility" }
      - { label: "Body (optional text below gallery)", name: "body", widget: "markdown", required: false }
